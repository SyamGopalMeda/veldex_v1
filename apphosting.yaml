# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0      # scale to zero when idle (lowest cost)
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Public Firebase web config (not secrets — these identify the project)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDxQ52wGfJj8YbIcWiig4_zmBNEeebDRwo
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: veldex-c8a64.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: veldex-c8a64
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: veldex-c8a64.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "532773917847"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:532773917847:web:a0ae222bad5af30eb045d2
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-DVCLDXEX9B

  # Canonical site address used for SEO (canonical URLs, sitemap, robots, schema).
  # Change this ONE value to https://www.veldexfabrications.com once that domain
  # is connected in Firebase App Hosting, then redeploy.
  - variable: NEXT_PUBLIC_BASE_URL
    value: https://veldex-web--veldex-c8a64.asia-southeast1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # Server-only: administrator allowlist. The Admin SDK uses the backend's own
  # service account in production, so no private key is deployed.
  - variable: ADMIN_EMAILS
    value: admin@veldexfabrications.com,syamgopalmeda@gmail.com
    availability:
      - RUNTIME
