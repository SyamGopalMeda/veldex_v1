<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Sharp Vector Render Quality -->
    <style>
      .logo-bg { fill: #FFFFFF; }
      .logo-symbol-black { fill: #000000; }
      .logo-symbol-white { fill: #FFFFFF; }
      .logo-lightning-stroke { stroke: #000000; stroke-width: 14; stroke-linejoin: miter; fill: #FFFFFF; }
      .logo-text { font-family: 'Montserrat', 'Arial Black', sans-serif; font-weight: 900; fill: #000000; letter-spacing: 4px; }
      .logo-divider { stroke: #000000; stroke-width: 12; stroke-linecap: square; }
    </style>
  </defs>

  <!-- Clean Plain White Background with Generous Margins -->
  <rect width="100%" height="100%" class="logo-bg" />

  <!-- Master Center Group -->
  <g transform="translate(0, 0)">
    <!-- Main "V" Symbol -->
    <g id="V-Symbol">
      <!-- Left Leg (Welding Holder Arm) -->
      <path d="M 380 500 L 400 500 L 320 280 L 260 280 L 340 440 Z" class="logo-symbol-black" />
      
      <!-- Torch / Electrode Grip Handle -->
      <path d="M 270 280 L 305 200 L 340 215 L 305 295 Z" class="logo-symbol-black" />
      <!-- Torch Trigger / Lever -->
      <path d="M 285 240 L 270 260 L 280 290 L 295 270 Z" class="logo-symbol-black" />
      <!-- Electrode Clamp Head -->
      <circle cx="330" cy="180" r="22" class="logo-symbol-black" />
      <circle cx="330" cy="180" r="7" class="logo-symbol-white" />
      <!-- Welding Electrode Rod Stick -->
      <line x1="160" y1="280" x2="360" y2="160" stroke="#000000" stroke-width="12" stroke-linecap="round" />

      <!-- White Stripes on Arm -->
      <polygon points="325,410 365,410 340,375 300,375" fill="#FFFFFF" />
      <polygon points="345,455 385,455 360,420 320,420" fill="#FFFFFF" />

      <!-- Right Leg (Lightning Bolt) forming the Right Arm of "V" -->
      <!-- Black Outline Path / Base -->
      <path d="M 400 500 L 580 180 L 470 180 L 510 300 L 420 300 L 400 500 Z" class="logo-symbol-black" />
      <!-- Inner White Lightning Bolt Fill -->
      <path d="M 412 485 L 565 195 L 485 195 L 520 312 L 432 312 Z" fill="#FFFFFF" />
    </g>

    <!-- Wordmark "VELDEX" -->
    <g id="Veldex-Wordmark" transform="translate(400, 600)">
      <text x="0" y="0" text-anchor="middle" font-size="78" font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-weight="900" letter-spacing="14" fill="#000000">VELDEX</text>
    </g>

    <!-- Horizontal Divider Underline -->
    <line x1="100" y1="635" x2="700" y2="635" class="logo-divider" />
  </g>
</svg>
